<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Ledger</title>
<style>
:root{--bg:#eef1fb;--fg:#1b2238;--mut:#6b7489;--card:#fff;--bd:#e1e5f2;--ac:#4f46e5;--ac2:#7c3aed;--acf:#fff;--ok:#059669;--bad:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--fg:#e8eaf6;--mut:#9aa3bd;--card:#1a1e33;--bd:#2c3250;--ac:#818cf8;--ac2:#a78bfa;--acf:#0f1220;--ok:#34d399;--bad:#fb7185}}
:root[data-theme="dark"]{--bg:#0f1220;--fg:#e8eaf6;--mut:#9aa3bd;--card:#1a1e33;--bd:#2c3250;--ac:#818cf8;--ac2:#a78bfa;--acf:#0f1220;--ok:#34d399;--bad:#fb7185}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,var(--ac),var(--ac2));color:var(--acf);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px;font-weight:600;border-radius:0 0 20px 20px;box-shadow:0 6px 20px rgba(79,70,229,.25)}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:20px;padding:7px 14px}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(30,40,90,.06)}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px;font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
button{padding:9px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
button.p{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:600}button.d{color:var(--bad)}button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{background:var(--card);border-radius:18px;padding:20px 14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 14px rgba(30,40,90,.08);border:1px solid var(--bd)}
.tile .ic{font-style:normal;font-size:26px;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.tile:nth-child(1) .ic{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.tile:nth-child(2) .ic{background:linear-gradient(135deg,#0ea5e9,#2563eb)}.tile:nth-child(3) .ic{background:linear-gradient(135deg,#14b8a6,#059669)}.tile:nth-child(4) .ic{background:linear-gradient(135deg,#f59e0b,#ea580c)}.tile:nth-child(5) .ic{background:linear-gradient(135deg,#ec4899,#be185d)}.tile:nth-child(6) .ic{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.tile:nth-child(7) .ic{background:linear-gradient(135deg,#22c55e,#15803d)}.tile:nth-child(8) .ic{background:linear-gradient(135deg,#64748b,#334155)}.tile:nth-child(9) .ic{background:linear-gradient(135deg,#06b6d4,#0e7490)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 6px;border-top:1px solid var(--bd);cursor:pointer;border-radius:10px}
.row:first-child{border-top:0}.row:hover{background:var(--bg)}.mut{color:var(--mut);font-size:13px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mut);background:var(--bg)}tr:nth-child(even) td{background:rgba(120,130,200,.05)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}.big{font-size:28px;font-weight:800}
.h{padding:8px 0;border-top:1px solid var(--bd);font-size:13px}
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kb button{padding:16px;font-size:18px}
#md{display:none;position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:20}.mb{max-width:380px;margin:20vh auto 0;padding:14px}
#tt{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;max-width:90%}
.login{max-width:380px;margin:12vh auto 0;padding:14px}
.tile:nth-child(10) .ic{background:linear-gradient(135deg,#f97316,#c2410c)}.tile:nth-child(11) .ic{background:linear-gradient(135deg,#475569,#1e293b)}
header button{font-size:15px}#pr{display:none}.ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;margin-bottom:12px;padding-bottom:6px}.ph h2{font-size:22px;margin:0}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:bold;display:inline-block}
.badge-on{background:rgba(5,150,105,.15);color:var(--ok)}.badge-off{background:rgba(107,116,137,.15);color:var(--mut)}
@media print{body{background:#fff!important;color:#000!important}#app,#md,#tt{display:none!important}#pr{display:block;color:#000;background:#fff;font-size:12px}#pr .card{border:0;box-shadow:none;padding:0 0 10px;background:#fff}#pr table{min-width:0}#pr th,#pr td{padding:4px 6px;border:1px solid #999;color:#000;background:#fff!important}#pr .w{overflow:visible}#pr .neg,#pr .pos,#pr .mut{color:#000!important}#pr tr{page-break-inside:avoid}@page{margin:12mm}}
</style></head><body><div id="app"></div><div id="md"></div><div id="tt"></div><div id="pr"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
function T(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var K='ledger_v1',S={customers:[],sbd:[],sdh:[],work:[],history:[]},V={v:'home',k:'c',p:null,e:null,q:'',d:T(),t:'c',m:T().slice(0,7),wp:null};
try{var r=JSON.parse(localStorage.getItem(K));if(r&&r.customers)S=r}catch(x){}
function norm(){['customers','sbd','sdh','work','history'].forEach(function(k){S[k]=S[k]||[]})}
norm();
var LK={c:'customers',b:'sbd',h:'sdh'},TT={c:'Customers',b:'Supplier BD',h:'Supplier DH'},U={c:'SAR',b:'TK',h:''},CH={c:['SAR','Deposit'],b:['TK','Deduction (TK)'],h:['Amount','Payment']};
var BANKS=['Sonali Bank','Janata Bank','Agrani Bank','Rupali Bank','Bangladesh Krishi Bank','BASIC Bank','Islami Bank Bangladesh','Dutch-Bangla Bank','BRAC Bank','City Bank','Eastern Bank','Prime Bank','Pubali Bank','Uttara Bank','Mutual Trust Bank','One Bank','Southeast Bank','Standard Chartered','HSBC','Social Islami Bank','AB Bank','NCC Bank','Jamuna Bank','Trust Bank','Bank Asia','Mercantile Bank','Midland Bank','Dhaka Bank','NRB Bank','Shahjalal Islami Bank','First Security Islami Bank','Al-Arafah Islami Bank','EXIM Bank','Union Bank','Premier Bank','bKash','Nagad','Rocket'];
var MY_DEVICE_ID = localStorage.getItem('ledger_dev_id') || id();
localStorage.setItem('ledger_dev_id', MY_DEVICE_ID);

function $(i){return document.getElementById(i)}
function prune(){var l=Date.now()-2*365.25*864e5;S.history=S.history.filter(function(x){return new Date(x.t).getTime()>=l})}
function log(t,pid){norm();S.history.unshift({t:new Date().toISOString(),c:pid||null,x:t});prune();save()}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(n){return Number(n).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function L(k){norm();return S[LK[k]]||[]}
function P(k,i){return L(k).find(function(p){return p.id===i})}
function amt(k,t){var a=parseFloat(t.desc)||0,r=parseFloat(t.rate)||0;return k==='c'?(a>0&&r>0?Math.round(a/r):0):Math.round(a*r*100)/100}
function wt(t,pid,d){norm();return S.work.filter(function(w){return w.k===t&&w.pid===pid&&w.date===d}).reduce(function(a,w){return a+w.amt},0)}
function rows(k,p){norm();var it=(p.tx||[]).map(function(t){return{date:t.date,desc:t.desc,rate:t.rate,a:amt(k,t),d:parseFloat(t.dep)||0,id:t.id}});
 if(k==='b')S.work.filter(function(w){return w.k==='s'&&w.pid===p.id}).forEach(function(w){it.push({date:w.date,desc:'Work - '+w.bank+(w.name?' ('+w.name+')':''),rate:'',a:0,d:w.amt,w:1})});
 it.sort(function(x,z){return x.date<z.date?-1:x.date>z.date?1:0});var b=0;return it.map(function(x){b+=x.a-x.d;x.bal=b;return x})}
function total(k,p){var R=rows(k,p);return R.length?R[R.length-1].bal:0}

function go(v,k,p){
 if(ST.pins && ST.pins[v]){
  verifyOptionPin(v, function(){
   V.v=v;if(k)V.k=k;if(p)V.p=p;V.e=null;V.q='';V.wp=null;render();
  });
  return;
 }
 V.v=v;if(k)V.k=k;if(p)V.p=p;V.e=null;V.q='';V.wp=null;render();
}

function sq(v){V.q=v;var el=$('lst');if(el)el.innerHTML=LH()}
function srch(){return '<input placeholder="Search..." oninput="sq(this.value)" style="margin-bottom:10px">'}
function tbl(k,R,ed,pid){pid=pid||V.p;return '<div class="w"><table><tr><th>Date</th><th>Description</th><th>Rate</th><th>'+CH[k][0]+'</th><th>'+CH[k][1]+'</th><th>Balance</th>'+(ed?'<th></th>':'')+'</tr>'+(R.map(function(x){var w=(k==='h'?0:wt(k==='b'?'s':'c',pid,x.date));
 return '<tr><td>'+esc(x.date)+'</td><td>'+esc(x.desc)+(w&&!x.w?' <span class="mut">(Work total '+f(w)+')</span>':'')+'</td><td>'+esc(x.rate)+'</td><td>'+(x.a?f(x.a):'')+'</td><td>'+(x.d?f(x.d):'')+'</td><td><b>'+f(x.bal)+'</b></td>'+(ed?'<td>'+(x.w?'':'<button onclick="V.e=\''+x.id+'\';render()">Edit</button> <button class="d" onclick="delT(\''+x.id+'\')">X</button>')+'</td>':'')+'</tr>'}).join('')||'<tr><td colspan="7" class="mut">No entries.</td></tr>')+'</table></div>'}
function hist(pid){norm();var q=V.q.toLowerCase(),H=S.history.filter(function(x){return(!pid||x.c===pid)&&(!q||x.x.toLowerCase().indexOf(q)>-1)});
 return H.length?H.map(function(x){return '<div class="h"><span class="mut">'+new Date(x.t).toLocaleString()+'</span><br>'+esc(x.x)+'</div>'}).join(''):'<span class="mut">No changes found.</span>'}
function LH(){norm();var q=V.q.toLowerCase(),v=V.v,k=V.k;
 if(v==='list')return L(k).filter(function(p){return(p.name+' '+p.phone+' '+p.desc).toLowerCase().indexOf(q)>-1}).map(function(p){var b=total(k,p),w=k==='h'?0:wt(k==='b'?'s':'c',p.id,T());
  return '<div class="row" onclick="go(\'party\',\''+k+'\',\''+p.id+'\')"><div><b>'+esc(p.name)+'</b><div class="mut">'+esc(p.phone)+' '+esc(p.desc)+(w?' | Work today: '+f(w):'')+'</div></div><div class="'+(b>0?'neg':'pos')+'">'+f(b)+' '+U[k]+'</div></div>'}).join('')||'<span class="mut">Nothing found.</span>';
 if(v==='hist')return hist();
 if(v==='work'){
  if(!V.wp){
   var ps=L(V.t==='c'?'c':'b');
   return ps.filter(function(p){return p.name.toLowerCase().indexOf(q)>-1}).map(function(p){
    return '<div class="row" onclick="V.wp=\''+p.id+'\';render()"><div><b>'+esc(p.name)+'</b><div class="mut">'+esc(p.phone)+' '+esc(p.desc)+'</div></div><div class="mut">Select &rarr;</div></div>';
   }).join('')||'<span class="mut">No entries found.</span>';
  }
  var t=V.t,tot={},sum=0,out=S.work.filter(function(w){return w.k===t&&w.pid===V.wp&&w.date===V.d}).map(function(w){var p=P(t==='c'?'c':'b',w.pid),n=p?p.name:'(deleted)';return{w:w,n:n}});
  out.forEach(function(o){tot[o.n]=(tot[o.n]||0)+o.w.amt;sum+=o.w.amt});
  return Object.keys(tot).map(function(n){return '<div class="h"><b>'+esc(n)+'</b> total '+f(tot[n])+out.filter(function(o){return o.n===n}).map(function(o){return '<div class="mut">'+(o.w.name?'<b>'+esc(o.w.name)+'</b> - ':'')+esc(o.w.bank)+': '+f(o.w.amt)+' <button class="d" onclick="delW(\''+o.w.id+'\')">X</button></div>'}).join('')+'</div>'}).join('')+'<div class="h"><b>Day total: '+f(sum)+'</b></div>';
 }
 if(v==='rep')return L(k).filter(function(p){return p.name.toLowerCase().indexOf(q)>-1}).map(function(p){var R=rows(k,p),mr=R.filter(function(x){return x.date.slice(0,7)===V.m}),pr=R.filter(function(x){return x.date.slice(0,7)<V.m}),ob=pr.length?pr[pr.length-1].bal:0,ca=0,cd=0;
  mr.forEach(function(x){ca+=x.a;cd+=x.d});
  return '<div class="card"><h2>'+esc(p.name)+'</h2><div class="mut">Opening '+f(ob)+' | '+CH[k][0]+' '+f(ca)+' | '+CH[k][1]+' '+f(cd)+' | <b>Closing '+f(ob+ca-cd)+'</b></div>'+tbl(k,mr,false,p.id)+'</div>'}).join('')||'<span class="mut">Nothing found.</span>';
 return ''}

function render(){
 norm();
 if(V.v==='login')return loginUI();
 var v=V.v,k=V.k,h='<header><b>'+esc(ST.name)+'<small id="sy" style="font-weight:400;font-size:12px;margin-left:8px;opacity:.85">'+syt()+'</small></b><button onclick="pr0()">🖨</button><button onclick="go(\'set\')">⚙</button>'+(v!=='home'?'<button onclick="go(\'home\')">Menu</button>':'')+(AU&&(AU.currentUser)?'<button onclick="signOutUser()">Sign out</button>':'')+'</header><main>';
 if(v==='home'){h+='<h1>Menu</h1><div class="tiles">'+[['Customer',"list",'c'],['Supplier BD',"list",'b'],['Supplier DH',"list",'h'],['Calculator',"calc"],['Work',"work"],['Report',"rep",'b'],['Total End Balance',"end"],['History',"hist"],['Backup',"bk"],['Print',"prn"],['Settings',"set"]].map(function(m){return '<div class="tile" onclick="go(\''+m[1]+'\''+(m[2]?',\''+m[2]+'\'':'')+')">'+'<i class="ic">'+(IC[m[0]]||'')+'</i><span>'+m[0]+'</span></div>'}).join('')+'</div>'}
 else if(v==='list'){h+='<h1>'+TT[k]+'</h1><div class="card"><h2>Add</h2><div class="g"><div><label>Name</label><input id="n"></div><div><label>Mobile</label><input id="p" type="tel"></div><div><label>Description</label><input id="d"></div><button class="p" onclick="addP()">Add</button></div></div><div class="card">'+srch()+'<div id="lst">'+LH()+'</div></div>'}
 else if(v==='party'){var p=P(k,V.p);
  if(!p){V.v='list';render();return;}
  var e=V.e?p.tx.find(function(t){return t.id===V.e}):null,R=rows(k,p);
  h+='<div class="bar"><button onclick="go(\'list\',\''+k+'\')">Back</button><button onclick="editP()">Edit</button><button class="d" onclick="delP()">Delete Customer</button></div><h1>'+esc(p.name)+'</h1><div class="mut">'+esc(p.phone)+' '+esc(p.desc)+'</div><div class="card"><div class="mut">Balance</div><div class="big">'+f(total(k,p))+' '+U[k]+'</div></div>';
  h+='<div class="card"><h2>'+(e?'Edit entry':'Add entry')+'</h2><div class="g"><div><label>Date</label><input id="dt" type="date" value="'+(e?e.date:T())+'"></div><div><label>Description (amount)</label><input id="ds" type="number" step="any" value="'+(e?esc(e.desc):'')+'" oninput="pv()"></div><div><label>Rate</label><input id="rt" type="number" step="any" value="'+(e?esc(e.rate):'')+'" oninput="pv()"></div><div><label>'+(k==='b'?'TK (Deduction)':'Deposit')+'</label><input id="dp" type="number" step="any" value="'+(e&&e.dep?esc(e.dep):'')+'"></div></div><div class="mut" id="pvw" style="margin:8px 0"></div><button class="p" onclick="saveT()">'+(e?'Save changes':'Add')+'</button> '+(e?'<button onclick="V.e=null;render()">Cancel</button>':'')+'</div>';
  h+='<div class="card">'+tbl(k,R,true)+'</div><div class="card"><h2>History</h2>'+hist(p.id)+'</div>'}
 else if(v==='calc'){h+='<h1>Calculator</h1><div class="card" style="max-width:340px"><input id="cd" readonly style="font-size:24px;text-align:right;margin-bottom:10px"><div class="kb">'+['C','%','⌫','/','7','8','9','*','4','5','6','-','1','2','3','+','(','0',')','.'].map(function(c){return '<button onclick="ck(\''+c+'\')">'+c+'</button>'}).join('')+'<button class="p" style="grid-column:span 4" onclick="ck(\'=\')">=</button></div></div>'}
 else if(v==='work'){var t=V.t,ps=L(t==='c'?'c':'b'),selP=V.wp?P(t==='c'?'c':'b',V.wp):null;
  h+='<h1>Work</h1><div class="bar"><button class="'+(t==='c'?'on':'')+'" onclick="V.t=\'c\';V.wp=null;render()">Customer</button><button class="'+(t==='s'?'on':'')+'" onclick="V.t=\'s\';V.wp=null;render()">Supplier BD</button></div>';
  if(!V.wp){
   h+='<div class="card"><h2>Select '+(t==='c'?'Customer':'Supplier BD')+'</h2>'+srch()+'<div id="lst">'+LH()+'</div></div>';
  } else {
   h+='<div class="bar"><button onclick="V.wp=null;render()">← Change Selection</button></div>';
   h+='<div class="card"><h2>Add Work for: '+esc(selP?selP.name:'')+'</h2><div class="g">'+
   '<div><label>1. Date</label><input id="wd" type="date" value="'+V.d+'" onchange="V.d=this.value;render()"></div>'+
   '<div><label>2. Name</label><input id="wn" placeholder="Enter name"></div>'+
   '<div><label>3. Bank</label><select id="wb">'+BANKS.map(function(b){return '<option>'+b+'</option>'}).join('')+'</select></div>'+
   '<div><label>4. Amount</label><input id="wa" type="number" step="any"></div>'+
   '<button class="p" onclick="addW()">Add Work Entry</button></div></div>'+
   '<div class="card"><h2>Entries for '+V.d+'</h2>'+srch()+'<div id="lst">'+LH()+'</div></div>';
  }
 }
 else if(v==='rep'){h+='<h1>Monthly Report</h1><div class="bar"><button class="'+(k==='b'?'on':'')+'" onclick="V.k=\'b\';render()">Supplier BD</button><button class="'+(k==='h'?'on':'')+'" onclick="V.k=\'h\';render()">Supplier DH</button><input type="month" value="'+V.m+'" onchange="V.m=this.value;render()" style="width:auto"></div>'+srch()+'<div id="lst">'+LH()+'</div>'}
 else if(v==='end'){var s=0; var custs=S.customers||[];
  h+='<h1>Total End Balance</h1><div class="card"><div class="mut">All customers (main ledger only)</div><div class="big" id="te">0.00 SAR</div></div><div class="card">'+custs.map(function(c){var b=total('c',c);s+=b;return '<div class="row" style="cursor:default"><span>'+esc(c.name)+'</span><span class="'+(b>0?'neg':'pos')+'">'+f(b)+' SAR</span></div>'}).join('')+'</div>';
  setTimeout(function(){var el=$('te');if(el)el.textContent=f(s)+' SAR';},10);
 }
 else if(v==='hist'){h+='<h1>History</h1><p class="mut">Kept for 2 years.</p><div class="card">'+srch()+'<div id="lst">'+LH()+'</div></div>'}
 else if(v==='set'){h+=setUI()}else if(v==='prn'){h+=prnUI()}
 else{h+='<h1>Backup</h1><div class="card"><h2>Back up</h2><p class="mut">Copy this text and keep it safe. It holds everything.</p><textarea id="bt" rows="6" readonly onclick="this.select()">'+esc(JSON.stringify(S))+'</textarea><br><br><button class="p" onclick="cp()">Copy</button></div><div class="card"><h2>Restore</h2><p class="mut">Paste a backup. This replaces current data.</p><textarea id="rt2" rows="5"></textarea><br><br><button onclick="rest()">Restore</button></div>'}
